# The terminals that ttybench measures, an example: copy it and keep the
# terminals that you have, each of the config that your session wants.
#
# launch: the program and its arguments, of the placeholders `{app}` (the
# bundle), `{command}` (the script that ttybench runs in the terminal) and
# `{cwd}` (the folder it starts in); or "open", which opens a `.command`
# script with the app, for a terminal that takes no command on its command
# line.
#
# env: what its environment gets beside ttybench's, as the folder of a
# config of the session's, the same font, size and window for every
# terminal, so that their measures compare: copy examples/configs to
# ~/ttybench/configs, which XDG_CONFIG_HOME points the terminals that read
# it at. Terminal.app, iTerm2 and Warp read no such folder: give their
# profiles the same font, size and window by hand.
#
# beside: for the measures beside a pane that floods, the keys that open
# a pane beside the measured one and give it the keyboard (open), and the
# keys that give the keyboard back to the measured pane (back), or where
# to click in it (click), as shares of the window's width and height from
# its top left. A key's character is the US layout's.
#
# quit: how it quits once measured: "signal", the default, a SIGTERM to
# its processes, or "app", its own quit, as its menu's, for a terminal
# that keeps state or asks before it quits; a SIGKILL past a deadline
# either way.
#
# features: what a terminal can do that another may not, as smooth
# scrolling, and how it turns on: the variables that its environment gets
# in place of its base's, as the folder of a config of the feature on, or
# the arguments that its program gets after its name. Give each terminal
# a base config of every feature off. A tool's `--feature <name>` measures
# the terminals that have it, of it on, and skips the others, so that each
# measure compares the same thing.

[terminals.ghostty]
app = "/Applications/Ghostty.app"
launch = ["{app}/Contents/MacOS/ghostty", "-e", "{command}"]
env = { XDG_CONFIG_HOME = "~/ttybench/configs" }
beside = { open = ["cmd+d"], back = ["cmd+["] }

[terminals.alacritty]
app = "/Applications/Alacritty.app"
launch = ["{app}/Contents/MacOS/alacritty", "-e", "{command}"]
env = { XDG_CONFIG_HOME = "~/ttybench/configs" }

[terminals.kitty]
app = "/Applications/kitty.app"
launch = ["{app}/Contents/MacOS/kitty", "{command}"]
env = { XDG_CONFIG_HOME = "~/ttybench/configs" }
# Its first layout puts a new window below the first: a click above.
beside = { open = ["cmd+enter"], click = [0.5, 0.25] }

[terminals.warp]
app = "/Applications/Warp.app"
launch = "open"

[terminals.iterm2]
app = "/Applications/iTerm.app"
launch = "open"
beside = { open = ["cmd+d"], back = ["cmd+["] }

[terminals.terminal]
app = "/System/Applications/Utilities/Terminal.app"
launch = "open"

[terminals.lokyr]
app = "/Applications/Lokyr.app"
launch = "open"
beside = { open = ["cmd+d"], back = ["cmd+["] }
env = { XDG_CONFIG_HOME = "~/ttybench/configs" }               # [window] smooth-scroll = false
# features.smooth-scroll = { env = { XDG_CONFIG_HOME = "~/ttybench/configs-smooth" } }  # = true
