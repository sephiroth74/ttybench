[package]
name = "ttybench-core"
description = "The library that ttybench's tools share: finding the tools, the terminals' config, their launch, the results."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "libc", "NSRunningApplication"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { workspace = true, features = ["std", "libc", "CGEvent", "CGEventTypes", "CGDirectDisplay", "CGRemoteOperation", "CGWindow"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true
